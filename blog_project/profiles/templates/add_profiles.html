{% extends "base.html" %}

{% block title %}Add profiles{% endblock title %}
{% block add_profiles %}

<form method="post" style="width: 50%; margin: auto;  ">
    {% csrf_token %}

    {{profile_form|crispy}}

    <button
        type="submit"

    >
        Submit
    </button>
    
</form>

{% endblock add_profiles %}
