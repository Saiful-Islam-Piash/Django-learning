{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Add category{% endblock title %}
{% block add_category %}

<form method="post" style="width: 50%; margin: auto;  ">
    <h1>This is Add Category</h1>
    {% csrf_token %}

    {{form|crispy}}

    <button
        type="submit"
        class="btn btn-primary"
    >
        Submit
    </button>
    
</form>

{% endblock add_category %}
