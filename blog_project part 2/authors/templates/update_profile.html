{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Add Athor{% endblock title %}
{% block add_author %}



<form method="post" style="width: 50%; margin: auto; margin-top: 4px; ">
    <h1>Update Your Profile </h1>
    <a class="btn btn-warning btn-sm " href="{% url 'pass_change'%}">Change Your Password</a>
    {% csrf_token %}

    {{form|crispy}}

    <button
        type="submit"
        class="btn btn-primary mb-5"
    >
        Submit
    </button>
    
</form>


{% endblock  %}
